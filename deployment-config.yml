# Deployment Instructions

## Local Development Setup

1. **Clone Repository**
   ```bash
   git clone https://github.com/your-team/sih-dropout-prediction
   cd sih-dropout-prediction
   ```

2. **Environment Setup**
   ```bash
   cp .env.example .env
   # Edit .env with your configuration
   ```

3. **Start Services**
   ```bash
   docker-compose up -d
   ```

4. **Access Application**
   - Frontend: http://localhost:3000
   - Backend API: http://localhost:5000
   - MongoDB: localhost:27017

## Production Deployment (AWS/Digital Ocean)

1. **Server Setup**
   ```bash
   # Install Docker and Docker Compose
   curl -fsSL https://get.docker.com -o get-docker.sh
   sh get-docker.sh
   sudo usermod -aG docker $USER
   
   # Install Docker Compose
   sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
   sudo chmod +x /usr/local/bin/docker-compose
   ```

2. **SSL Certificate (Let's Encrypt)**
   ```bash
   sudo apt install certbot
   sudo certbot certonly --standalone -d yourdomain.com
   ```

3. **Deploy Application**
   ```bash
   # Clone repository
   git clone https://github.com/your-team/sih-dropout-prediction
   cd sih-dropout-prediction
   
   # Configure environment
   cp .env.example .env
   # Edit .env with production values
   
   # Start services
   docker-compose -f docker-compose.prod.yml up -d
   ```

4. **Monitor Services**
   ```bash
   # Check service status
   docker-compose ps
   
   # View logs
   docker-compose logs -f backend
   docker-compose logs -f frontend
   ```

## Monitoring and Maintenance

### Health Checks
```bash
# Backend health
curl http://localhost:5000/health

# Database connection
docker exec edupredict_mongodb mongo --eval "db.adminCommand('ismaster')"
```

### Backup Strategy
```bash
# MongoDB backup
docker exec edupredict_mongodb mongodump --out /backup/$(date +%Y%m%d)

# Automated backup script (add to cron)
#!/bin/bash
BACKUP_DIR="/var/backups/edupredict"
DATE=$(date +%Y%m%d_%H%M%S)
mkdir -p $BACKUP_DIR
docker exec edupredict_mongodb mongodump --out $BACKUP_DIR/mongo_$DATE
tar -czf $BACKUP_DIR/backup_$DATE.tar.gz $BACKUP_DIR/mongo_$DATE
rm -rf $BACKUP_DIR/mongo_$DATE
```

### Security Hardening
```bash
# Firewall configuration
sudo ufw allow 22/tcp
sudo ufw allow 80/tcp
sudo ufw allow 443/tcp
sudo ufw enable

# Regular updates
sudo apt update && sudo apt upgrade -y
docker-compose pull && docker-compose up -d
```

## Scaling Options

### Horizontal Scaling
```yaml
# Add to docker-compose.yml
backend:
  deploy:
    replicas: 3
    resources:
      limits:
        memory: 1G
      reservations:
        memory: 512M
```

### Load Balancer Configuration
```nginx
upstream backend {
    least_conn;
    server backend1:5000 weight=3;
    server backend2:5000 weight=3;
    server backend3:5000 weight=2;
}
```

### Database Clustering
```yaml
# MongoDB Replica Set
mongodb-primary:
  image: mongo:5.0
  command: mongod --replSet rs0 --bind_ip_all
  
mongodb-secondary:
  image: mongo:5.0
  command: mongod --replSet rs0 --bind_ip_all
```

